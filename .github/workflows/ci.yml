name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.10"

jobs:
  # ────────────────── 应用面 FastAPI ──────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -e ".[dev]"

      - run: ruff check app/ tests/

      - run: mypy app/ --ignore-missing-imports || true

      - run: pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: backend/coverage.xml

  # ────────────────── 控制面 Go ──────────────────
  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go vet ./...

      - run: go test ./... -v -cover

      - run: CGO_ENABLED=0 go build -o control-plane ./cmd/server

  # ────────────────── 前端 React ──────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

  # ────────────────── Docker 构建 ──────────────────
  docker:
    needs: [backend, control-plane, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: deploy/docker/Dockerfile.backend
          tags: eitp/backend:latest
          push: false

      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: deploy/docker/Dockerfile.control-plane
          tags: eitp/control-plane:latest
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: deploy/docker/Dockerfile.frontend
          tags: eitp/frontend:latest
          push: false

  # ────────────────── Schema 迁移检查 ──────────────────
  migration-check:
    needs: [backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eitp_test
          POSTGRES_USER: eitp
          POSTGRES_PASSWORD: eitp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eitp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -e ".[dev]"

      - run: alembic upgrade head
        env:
          DB_URL: postgresql+asyncpg://eitp:eitp_test@localhost:5432/eitp_test

      - run: alembic check
        env:
          DB_URL: postgresql+asyncpg://eitp:eitp_test@localhost:5432/eitp_test