# EITP Multi-Tenant - 独立实例模式部署
# 大客户租户拥有独立 PostgreSQL 实例 + 独立后端实例，物理隔离
# 适用于：大型企业、强合规需求、SLA 独立保障

services:
  # 控制面
  postgres-control:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eitp_control
      POSTGRES_USER: eitp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eitp_dev}
    volumes:
      - pg-control:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eitp"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ../../control-plane
      dockerfile: ../deploy/docker/Dockerfile.control-plane
    environment:
      DB_URL: postgres://eitp:${DB_PASSWORD:-eitp_dev}@postgres-control:5432/eitp_control
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres-control:
        condition: service_healthy

  # 租户A独立实例
  postgres-tenant-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eitp_tenant_a
      POSTGRES_USER: eitp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eitp_dev}
    volumes:
      - pg-tenant-a:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eitp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-tenant-a:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_URL: postgresql+asyncpg://eitp:${DB_PASSWORD:-eitp_dev}@postgres-tenant-a:5432/eitp_tenant_a
      PLACEMENT_MODE: dedicated_instance
      TENANT_ID: ${TENANT_A_ID}
      LOG_LEVEL: info
    ports:
      - "8001:8000"
    depends_on:
      postgres-tenant-a:
        condition: service_healthy

  # 租户B独立实例
  postgres-tenant-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eitp_tenant_b
      POSTGRES_USER: eitp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eitp_dev}
    volumes:
      - pg-tenant-b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eitp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-tenant-b:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_URL: postgresql+asyncpg://eitp:${DB_PASSWORD:-eitp_dev}@postgres-tenant-b:5432/eitp_tenant_b
      PLACEMENT_MODE: dedicated_instance
      TENANT_ID: ${TENANT_B_ID}
      LOG_LEVEL: info
    ports:
      - "8002:8000"
    depends_on:
      postgres-tenant-b:
        condition: service_healthy

  # 网关：按 tenant_id 路由到对应后端实例
  gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-tenant-a
      - backend-tenant-b

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  pg-control:
  pg-tenant-a:
  pg-tenant-b: