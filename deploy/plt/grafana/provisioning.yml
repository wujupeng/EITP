apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: localhost:5432
    database: eitp
    user: eitp_readonly

dashboards:
  - name: 'EITP Platform Overview'
    folder: 'EITP'
    file: dashboards/platform_overview.json