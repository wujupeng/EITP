global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'eitp-backend'
    metrics_path: '/api/v1/plt/observability/metrics'
    static_configs:
      - targets: ['localhost:8000']
    labels:
      service: 'eitp-backend'

  - job_name: 'eitp-frontend'
    static_configs:
      - targets: ['localhost:3000']
    labels:
      service: 'eitp-frontend'

  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    labels:
      service: 'postgres'

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    labels:
      service: 'redis'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']