apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

dashboardProviders:
  - name: 'rel'
    orgId: 1
    folder: 'EITP-REL'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/rel

dashboards:
  - name: 'rel-seal-overview'
    json: |
      {
        "title": "REL 封版总览",
        "panels": [
          {
            "title": "门禁执行总数",
            "type": "stat",
            "targets": [{"expr": "sum(eitp_rel_seal_gate_total)"}]
          },
          {
            "title": "门禁通过率",
            "type": "gauge",
            "targets": [{"expr": "sum(eitp_rel_seal_gate_total{result=\"PASS\"}) / sum(eitp_rel_seal_gate_total)"}]
          },
          {
            "title": "资产快照采集耗时",
            "type": "graph",
            "targets": [{"expr": "histogram_quantile(0.95, sum(rate(eitp_rel_asset_snapshot_duration_seconds_bucket[5m])) by (le, asset_type))"}]
          },
          {
            "title": "核心冻结校验结果",
            "type": "stat",
            "targets": [{"expr": "eitp_rel_core_freeze_verification_result"}]
          },
          {
            "title": "资产快照篡改总数",
            "type": "stat",
            "targets": [{"expr": "sum(eitp_rel_asset_snapshot_tamper_total)"}]
          }
        ]
      }