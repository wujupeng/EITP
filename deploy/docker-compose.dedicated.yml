# EITP Multi-Tenant - 独立数据库模式部署
# 大客户租户拥有独立 PostgreSQL 数据库，连接路由按 tenant_id 分发
# 适用于：中等规模租户、数据隔离要求高、合规需求

services:
  # 控制面数据库（存储租户元数据、放置记录）
  postgres-control:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eitp_control
      POSTGRES_USER: eitp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eitp_dev}
    ports:
      - "5430:5432"
    volumes:
      - pg-control:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eitp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 租户A独立数据库
  postgres-tenant-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eitp_tenant_a
      POSTGRES_USER: eitp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eitp_dev}
    ports:
      - "5431:5432"
    volumes:
      - pg-tenant-a:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eitp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 租户B独立数据库
  postgres-tenant-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eitp_tenant_b
      POSTGRES_USER: eitp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eitp_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg-tenant-b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eitp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      # 连接路由器根据 tenant_id 选择目标数据库
      DB_URL_CONTROL: postgresql+asyncpg://eitp:${DB_PASSWORD:-eitp_dev}@postgres-control:5432/eitp_control
      DB_URL_TENANT_A: postgresql+asyncpg://eitp:${DB_PASSWORD:-eitp_dev}@postgres-tenant-a:5432/eitp_tenant_a
      DB_URL_TENANT_B: postgresql+asyncpg://eitp:${DB_PASSWORD:-eitp_dev}@postgres-tenant-b:5432/eitp_tenant_b
      REDIS_URL: redis://redis:6379/0
      PLACEMENT_MODE: dedicated_db
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres-control:
        condition: service_healthy
      postgres-tenant-a:
        condition: service_healthy
      postgres-tenant-b:
        condition: service_healthy

  control-plane:
    build:
      context: ../../control-plane
      dockerfile: ../deploy/docker/Dockerfile.control-plane
    environment:
      DB_URL: postgres://eitp:${DB_PASSWORD:-eitp_dev}@postgres-control:5432/eitp_control
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres-control:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg-control:
  pg-tenant-a:
  pg-tenant-b: