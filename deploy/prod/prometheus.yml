global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: eitp-backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: eitp-prod-verification
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "eitp_prod_.*"
        action: keep

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]