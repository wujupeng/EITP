version: "3.8"

services:
  minio-backup:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=eitp-backup
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/backup_password
      - MINIO_KMS_SECRET_KEY_FILE=/run/secrets/kms_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - backup-data:/data
      - wal-archive:/wal-archive
    secrets:
      - backup_password
      - kms_key

volumes:
  backup-data:
    driver: local
  wal-archive:
    driver: local

secrets:
  backup_password:
    external: true
  kms_key:
    external: true