# EITP Multi-Tenant - 共享数据库模式部署
# 所有租户共享同一 PostgreSQL 实例，通过 RLS 实现行级隔离
# 适用于：中小租户、快速开通、成本最优

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eitp_shared
      POSTGRES_USER: eitp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eitp_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg-shared:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eitp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_URL: postgresql+asyncpg://eitp:${DB_PASSWORD:-eitp_dev}@postgres:5432/eitp_shared
      REDIS_URL: redis://redis:6379/0
      PLACEMENT_MODE: shared_db
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control-plane:
    build:
      context: ../../control-plane
      dockerfile: ../deploy/docker/Dockerfile.control-plane
    environment:
      DB_URL: postgres://eitp:${DB_PASSWORD:-eitp_dev}@postgres:5432/eitp_shared
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg-shared: