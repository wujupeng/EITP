# EITP Multi-Tenant 监控配置
# Prometheus + Grafana + Loki 全链路可观测

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # 应用面 FastAPI
  - job_name: eitp-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
          component: app-plane

  # 控制面 Go
  - job_name: eitp-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane:8081"]
        labels:
          service: control-plane
          component: control-plane

  # 前端 Nginx
  - job_name: eitp-frontend
    static_configs:
      - targets: ["frontend:80"]
        labels:
          service: frontend
          component: web

  # PostgreSQL
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          component: database

  # Redis
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          component: cache

  # Node Exporter（主机指标）
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
          component: host