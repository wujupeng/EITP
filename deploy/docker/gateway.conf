# 独立实例模式网关 - 按 X-Tenant-Token 路由到对应租户后端实例
# 生产环境应使用 API Gateway（如 Kong/APISIX）实现动态路由

upstream backend_tenant_a {
    server backend-tenant-a:8000;
}

upstream backend_tenant_b {
    server backend-tenant-b:8000;
}

server {
    listen 80;

    # 默认路由到租户A（生产环境应通过 map 指令动态路由）
    location /api/v1/ {
        # 根据 X-Tenant-Token 头选择上游
        # 此处为示意，生产环境用 lua/map 实现动态路由
        proxy_pass http://backend_tenant_a;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-Token $http_x_tenant_token;
    }

    location /health {
        proxy_pass http://backend_tenant_a;
    }
}