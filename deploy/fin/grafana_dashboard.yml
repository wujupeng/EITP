apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

dashboardProviders:
  - name: 'fin'
    orgId: 1
    folder: 'EITP-FIN'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/fin

dashboards:
  - name: 'fin-overview'
    json: |
      {
        "title": "FIN 财务与结算总览",
        "panels": [
          {
            "title": "结算单创建总数",
            "type": "stat",
            "targets": [{"expr": "sum(eitp_fin_settlement_created_total)"}]
          },
          {
            "title": "付款成功率",
            "type": "gauge",
            "targets": [{"expr": "avg(eitp_fin_payment_success_rate)"}]
          },
          {
            "title": "收款核销金额分布",
            "type": "graph",
            "targets": [{"expr": "histogram_quantile(0.95, sum(rate(eitp_fin_receipt_writeoff_amount_bucket[5m])) by (le))"}]
          },
          {
            "title": "发票开具总数",
            "type": "stat",
            "targets": [{"expr": "sum(eitp_fin_invoice_issued_total)"}]
          },
          {
            "title": "对账差异数量",
            "type": "stat",
            "targets": [{"expr": "sum(eitp_fin_recon_diff_count)"}]
          },
          {
            "title": "资金池余额",
            "type": "graph",
            "targets": [{"expr": "sum(eitp_fin_treasury_balance) by (account_type)"}]
          },
          {
            "title": "应收账龄分布",
            "type": "graph",
            "targets": [{"expr": "sum(eitp_fin_ar_aging_bucket) by (bucket)"}]
          }
        ]
      }